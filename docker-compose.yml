services:
  app:
    build: ./docker/php
    volumes:
      - ./laravel-app:/var/www/html
    networks:
      - saas_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./laravel-app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./laravel-app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - saas_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wa_agent
      POSTGRES_USER: wa_agent
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  queue:
    build: ./docker/php
    command: php artisan queue:work --queue=inbound,default,notifications,follow-ups --tries=3 --timeout=120 --sleep=3
    volumes:
      - ./laravel-app:/var/www/html
    depends_on:
      - app
      - redis
      - postgres
    env_file:
      - ./laravel-app/.env
    networks:
      - saas_network
    restart: unless-stopped

  scheduler:
    build: ./docker/php
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./laravel-app:/var/www/html
    depends_on:
      - app
    env_file:
      - ./laravel-app/.env
    networks:
      - saas_network
    restart: unless-stopped

  horizon:
    build: ./docker/php
    command: php artisan horizon
    volumes:
      - ./laravel-app:/var/www/html
    depends_on:
      - app
      - redis
    env_file:
      - ./laravel-app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - saas_network

  wa-gateway:
    build: ./wa-gateway
    ports:
      - "3001:3001"
    volumes:
      - ./wa-gateway:/app
      - wa_gateway_modules:/app/node_modules
      - wa_sessions:/app/sessions
    environment:
      LARAVEL_URL: http://nginx
      INTERNAL_SECRET: "${WA_INTERNAL_SECRET:-change_this_to_random_32_chars}"
      PORT: 3001
    depends_on:
      - app
    networks:
      - saas_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - saas_network

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - saas_network

networks:
  saas_network:
    driver: bridge

volumes:
  postgres_data:
  wa_sessions:
  wa_gateway_modules:
